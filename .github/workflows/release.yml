name: Release

# Every push to main that changes the app builds a DMG and publishes it as a GitHub release, along with the feed that
# installed copies check once a day. tools/next_version.sh picks the version: 1.0.0, then 1.0.1, 1.0.2, following
# MARKETING_VERSION's major.minor. The build number is the commit count, which is what installed copies compare.
on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Config/**'
      - 'Packages/**'
      - 'Sesame.xcodeproj/**'
      - 'tools/build_release.sh'
      - 'tools/make_appcast.py'
      - 'tools/next_version.sh'
      - 'tools/changelog.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (off builds and signs everything, then stops)
        type: boolean
        default: true

permissions:
  contents: write

# Two pushes in a row publish one after the other, never at the same time.
concurrency:
  group: release
  cancel-in-progress: false

env:
  SPARKLE_VERSION: 2.10.1

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Work out the version
        id: version
        run: |
          read -r VERSION BUILD < <(tools/next_version.sh)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION ($BUILD)"
          python3 tools/changelog.py "$VERSION" markdown > "$RUNNER_TEMP/notes.md"

      - name: Check signing is set up
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "::error::Run swift tools/setup_update_key.swift first."; exit 1; }
          test -n "$(plutil -extract SUPublicEDKey raw Config/Info.plist)" || { echo "::error::SUPublicEDKey is empty."; exit 1; }
          test -n "$SIGNING_CERTIFICATE_P12" || { echo "::error::Run tools/setup_ci_signing.sh first."; exit 1; }

      - name: Test unlock logic
        working-directory: Packages/SesameCore
        run: swift test

      - name: Load the signing certificate
        id: certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Apple Development" | grep -m1 -o '[0-9A-F]\{40\}' || true)"
          test -n "$IDENTITY" || { security find-identity -p codesigning "$KEYCHAIN"; echo "::error::No usable signing identity."; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          SIGNING_IDENTITY: ${{ steps.certificate.outputs.identity }}
          SIGNING_KEYCHAIN: ${{ steps.certificate.outputs.keychain }}
        run: |
          tools/build_release.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build }}"
          # Every release must carry an Apple-issued signature from the same team, or macOS treats the update as a
          # different app and asks for Accessibility, Input Monitoring, and the Keychain all over again.
          APP=build/release/derived/Build/Products/Release/Sesame.app
          codesign -d -r- "$APP" 2>&1 | grep -q 'anchor apple generic' || { echo "::error::Not signed by an Apple-issued certificate."; exit 1; }
          [ "$(codesign -dv "$APP" 2>&1 | sed -n 's/^TeamIdentifier=//p')" = "3P6YJ2SJ4X" ] || { echo "::error::Not signed by team 3P6YJ2SJ4X."; exit 1; }

      - name: Sign the update and write the feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG="build/release/Sesame-$VERSION.dmg"
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          OUTPUT="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - "$DMG")"
          SIGNATURE="$(echo "$OUTPUT" | sed -E 's/.*edSignature="([^"]+)".*/\1/')"
          LENGTH="$(stat -f%z "$DMG")"
          swift tools/verify_update_signature.swift "$DMG" "$SIGNATURE"
          NOTES_HTML="$(python3 tools/changelog.py "$VERSION" html)" python3 tools/make_appcast.py "$VERSION" "${{ steps.version.outputs.build }}" "$SIGNATURE" "$LENGTH" build/release/appcast.xml

      - name: Keep the DMG from a dry run
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: Sesame-${{ steps.version.outputs.version }}
          path: |
            build/release/*.dmg
            build/release/appcast.xml

      - name: Publish release
        if: (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" \
            "build/release/Sesame-$VERSION.dmg" \
            build/release/appcast.xml \
            --target "$GITHUB_SHA" \
            --title "Sesame $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove the signing keychain
        if: always() && steps.certificate.outputs.keychain != ''
        run: security delete-keychain "${{ steps.certificate.outputs.keychain }}" || true
