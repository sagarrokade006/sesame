name: Release

# Pushing a tag like v0.2.0 builds the DMG and publishes it, along with the feed installed copies check for updates.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  SPARKLE_VERSION: 2.10.1

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check update signing is set up
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "::error::Run tools/setup_update_key.swift first."; exit 1; }
          test -n "$(plutil -extract SUPublicEDKey raw Config/Info.plist)" || { echo "::error::SUPublicEDKey is empty."; exit 1; }

      - name: Test unlock logic
        working-directory: Packages/SesameCore
        run: swift test

      - name: Import Developer ID certificate
        id: certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$DEVELOPER_ID_P12" ]; then
            echo "No certificate configured, so this build will be ad-hoc signed."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          rm "$RUNNER_TEMP/certificate.p12"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          DEVELOPER_ID_IDENTITY: ${{ steps.certificate.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$DEVELOPER_ID_IDENTITY" ] || unset DEVELOPER_ID_IDENTITY
          tools/build_release.sh "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"

      - name: Sign the update and write the feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="build/release/Sesame-$VERSION.dmg"
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          OUTPUT="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - "$DMG")"
          SIGNATURE="$(echo "$OUTPUT" | sed -E 's/.*edSignature="([^"]+)".*/\1/')"
          LENGTH="$(stat -f%z "$DMG")"
          swift tools/verify_update_signature.swift "$DMG" "$SIGNATURE"
          python3 tools/make_appcast.py "$VERSION" "$GITHUB_RUN_NUMBER" "$SIGNATURE" "$LENGTH" build/release/appcast.xml

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/release/Sesame-$VERSION.dmg" \
            build/release/appcast.xml \
            --title "Sesame $VERSION" \
            --generate-notes
